services:
  - type: web
    name: toward-us-private-beta
    runtime: node
    # Paid (founder 11-06, "确认升级"): never sleeps, and keeps photos on the disk below. Free slept after 15 minutes
    # and lost every uploaded file on restart.
    plan: starter
    region: oregon
    buildCommand: npm ci --include=dev && npm run build && npm run test:app
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /api/health
    disk:
      name: pinky-media
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: TOWARD_US_MEDIA_DIR
        value: /var/data/media
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: toward-us-private-beta-db
          property: connectionString
      - key: DB_POOL_SIZE
        value: "5"
      - key: OPENAI_MODEL
        value: gpt-5.4
      - key: OPENAI_API_KEY
        sync: false
      # With a key, text and image work runs on Claude; OpenAI stays for live calls and voice.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        sync: false
      # Password-reset email; without a key, reset links cannot be sent in production.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: TOWARD_US_BASE_URL
        sync: false
      - key: SENDBLUE_API_KEY
        sync: false
      - key: SENDBLUE_API_SECRET
        sync: false
      - key: SENDBLUE_FROM_NUMBER
        sync: false
      - key: SENDBLUE_WEBHOOK_SECRET
        sync: false
      - key: SENDBLUE_GROUPS_ENABLED
        sync: false
      - key: FCM_SERVICE_ACCOUNT_JSON
        sync: false
      # Pinky membership and the beta board (docs/payments.zh-CN.md); the founder fills these in on Render.
      - key: FOUNDER_EMAILS
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

databases:
  - name: toward-us-private-beta-db
    databaseName: toward_us_private_beta
    user: toward_us_app
    # Paid: the free database expires 30 days after creation and is deleted 14 days later, with no backups.
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "18"
    ipAllowList: []
