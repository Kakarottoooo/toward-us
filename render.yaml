services:
  - type: web
    name: toward-us-private-beta
    runtime: node
    # Free for now (founder 11-07: "暂时不充钱，还不能上线"). Before inviting real users, switch to `plan: starter` and
    # add the disk below (≈ $13.25/month with the database): free sleeps after 15 minutes and loses uploads on restart.
    #   disk: { name: pinky-media, mountPath: /var/data, sizeGB: 1 }  plus env TOWARD_US_MEDIA_DIR=/var/data/media
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev && npm run build && npm run test:app
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: toward-us-private-beta-db
          property: connectionString
      - key: DB_POOL_SIZE
        value: "5"
      - key: OPENAI_MODEL
        value: gpt-5.4
      - key: OPENAI_API_KEY
        sync: false
      # With a key, text and image work runs on Claude; OpenAI stays for live calls and voice.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        sync: false
      # Password-reset email; without a key, reset links cannot be sent in production.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: TOWARD_US_BASE_URL
        sync: false
      - key: SENDBLUE_API_KEY
        sync: false
      - key: SENDBLUE_API_SECRET
        sync: false
      - key: SENDBLUE_FROM_NUMBER
        sync: false
      - key: SENDBLUE_WEBHOOK_SECRET
        sync: false
      - key: SENDBLUE_GROUPS_ENABLED
        sync: false
      - key: FCM_SERVICE_ACCOUNT_JSON
        sync: false
      # Pinky membership and the beta board (docs/payments.zh-CN.md); the founder fills these in on Render.
      # Public privacy / terms / support pages (server/legal.mjs): the address people write to and who runs Pinky.
      - key: PINKY_SUPPORT_EMAIL
        sync: false
      - key: PINKY_OPERATOR
        sync: false
      - key: FOUNDER_EMAILS
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

databases:
  - name: toward-us-private-beta-db
    databaseName: toward_us_private_beta
    user: toward_us_app
    # Free for now; it expires 30 days after creation and is deleted 14 days later, with no backups. basic-256mb before launch.
    plan: free
    region: oregon
    postgresMajorVersion: "18"
    ipAllowList: []
