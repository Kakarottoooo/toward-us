services:
  - type: web
    name: toward-us-private-beta
    runtime: node
    plan: starter
    numInstances: 1
    disk:
      name: pinky-media
      mountPath: /var/data
      sizeGB: 1
    region: oregon
    # Chromium for the read-only web lookups (server/readonly-web.mjs) and their tests, kept inside the project
    # (PLAYWRIGHT_BROWSERS_PATH=0) so the running service finds it too. Without it every build since #181 failed.
    buildCommand: npm ci --include=dev && npx playwright install chromium && npm run build && npm run test:app
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"
      # Render's proxy is the one hop in front: req.ip is the address it appended to X-Forwarded-For (server/auth-limits.mjs).
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: toward-us-private-beta-db
          property: connectionString
      - key: DB_POOL_SIZE
        value: "5"
      - key: OPENAI_MODEL
        value: gpt-5.4
      - key: OPENAI_API_KEY
        sync: false
      # With a key, text and image work runs on Claude; OpenAI stays for live calls and voice.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        sync: false
      # Password-reset email; without a key, reset links cannot be sent in production.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: TOWARD_US_BASE_URL
        sync: false
      - key: SENDBLUE_API_KEY
        sync: false
      - key: SENDBLUE_API_SECRET
        sync: false
      - key: SENDBLUE_FROM_NUMBER
        sync: false
      - key: SENDBLUE_WEBHOOK_SECRET
        sync: false
      - key: SENDBLUE_GROUPS_ENABLED
        sync: false
      - key: FCM_SERVICE_ACCOUNT_JSON
        sync: false
      # Pinky membership and the beta board (docs/payments.zh-CN.md); the founder fills these in on Render.
      # Public privacy / terms / support pages (server/legal.mjs): the address people write to and who runs Pinky.
      - key: OUREVER_SUPPORT_EMAIL
        value: patric@witnora.com
      - key: PINKY_OPERATOR
        value: Witnora, Inc.
      - key: TOWARD_US_MEDIA_DIR
        value: /var/data/media
      - key: PINKY_METRICS_ADMIN_TOKEN
        sync: false
      - key: FOUNDER_EMAILS
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

databases:
  - name: toward-us-private-beta-db
    databaseName: toward_us_private_beta
    user: toward_us_app
    # The live database is on Basic-256mb; saying free here made every Blueprint sync fail
    # ("cannot downgrade database from Basic-256mb to Free"), so build command changes never reached Render.
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "18"
    ipAllowList: []
