name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install browser for interaction checks
        run: npx playwright install --with-deps chromium
      - name: Test application boundaries
        run: npm run test:app
      - name: Test two-principal relationship workflow
        run: npm run test:relationship
      - name: Test desktop and mobile interactions
        run: npm run test:responsive
      - name: Build production assets
        run: npm run build
      - name: Test static hosting routes
        run: npm run test:sites
