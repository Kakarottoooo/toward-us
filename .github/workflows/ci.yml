name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: local-ci-password
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install browser for interaction checks
        run: npx playwright install --with-deps chromium
      - name: Test application boundaries
        run: npm run test:app
      - name: Verify real PostgreSQL lifecycle transactions
        env:
          POSTGRES_TEST_URL: postgresql://postgres:local-ci-password@localhost:5432/postgres
        run: npm run test:postgres
      - name: Test two-principal relationship workflow
        run: npm run test:relationship
      - name: Test desktop and mobile interactions
        run: npm run test:responsive
      - name: Build production assets
        run: npm run build
      - name: Test static hosting routes
        run: npm run test:sites
